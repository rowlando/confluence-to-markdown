name: confluence-to-markdown
version: 1.0.0
description: Agent skills for confluence-to-markdown, managed by APM
targets:
  - claude

# Matt Pocock's skills (https://github.com/mattpocock/skills), matching the
# set shipped in the mattpocock-skills Claude Code plugin. Each skill is
# referenced by sub-path so installs work without GitHub API access.
# To upgrade, bump the tag on every line, run `apm install`, and commit the
# updated .claude/skills/ and apm.lock.yaml.
dependencies:
  apm:
    - mattpocock/skills/skills/engineering/ask-matt#v1.3.1
    - mattpocock/skills/skills/engineering/diagnosing-bugs#v1.3.1
