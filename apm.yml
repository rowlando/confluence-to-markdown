name: confluence-to-markdown
version: 1.0.0
description: Agent skills for confluence-to-markdown, managed by APM
targets:
  - claude

# Skills are installed into .claude/skills/ by `apm install` (run
# automatically by the SessionStart hook in cloud sessions) and are not
# committed; apm.lock.yaml pins the exact commits.
dependencies:
  apm:
    - mattpocock/skills#v1.3.1   # https://github.com/mattpocock/skills
  mcp: []
includes: auto
scripts: {}
